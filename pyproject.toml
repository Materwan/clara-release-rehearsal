[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clara"
version = "1.0.0-rc11"
description = "Clara: a personal AI agent for one person, on one Linux machine, reachable only over Tailscale"
readme = "README.md"
license = { text = "All rights reserved" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "cryptography>=43",      # AES-GCM secrets store, scrypt, Ed25519 release signatures, encrypted PDFs
    "pypdf>=5.0",            # text of PDF attachments and project files
    "pillow>=11.0",          # frames of animated pictures sent to models
    "prompt_toolkit>=3.0",   # clara-chat and clara-admin
]

[project.optional-dependencies]
discord = ["discord.py>=2.4"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "vulture>=2.16",
]

[project.scripts]
clara = "clara.cli.ops:main"
clara-server = "clara.app:main"
clara-chat = "clara.cli.chat:main"
clara-admin = "clara.cli.admin:main"
clara-launcher = "clara.ops.launcher:main"
clara-discord = "clara_discord.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clara", "src/clara_discord"]
# The built web site is ignored by git (scripts/build-web.sh makes it) but ships in the wheel.
artifacts = ["src/clara/web/dist/**"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "G", "RUF100"]
ignore = [
    "E501",   # long lines are left to judgement
    "B905",   # zip() without strict=
    "S101",   # assert is fine in tests and invariants
    "S311",   # random is not used for secrets (secrets is)
    "S603",   # subprocess calls are made with lists, never a shell
    "S607",   # tools are found on PATH on purpose (git, podman, tailscale, restic)
    "ASYNC109", # `timeout` arguments here are what a script or a wait may last, not a cancellation scope
    "S608",   # SQL is composed only from the code's own column names and fixed fragments; values are always parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
