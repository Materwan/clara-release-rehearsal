# Every push and pull request: lint, the test suite on two Pythons, the web build (type-checked), the real sandbox
# (rootless Podman: no network, no .git, no host files) and a release built and checked like the updater does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen pytest -q

  web:
    name: Web site (svelte-check and build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build-web.sh
      - run: test -f src/clara/web/dist/index.html && test -f src/clara/web/dist/picker.html

  sandbox:
    name: Sandbox (rootless Podman)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: podman build -t localhost/clara-sandbox:latest sandbox/
      - run: uv sync --frozen --all-extras
      - name: Scripts see no network, no .git, no host environment
        env:
          CLARA_REQUIRE_SANDBOX: "1"
        run: uv run --frozen pytest -q tests/test_workspace.py -k "sees_no_network"

  release-dry-run:
    name: Release build (unsigned dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: scripts/build-release.sh "v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
